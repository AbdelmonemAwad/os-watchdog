#
# The page's two questions: what the timer is doing, and arm it again from the settings just saved.

# errors:no because a script_output whose script exits non-zero is answered "Execute error" with the
# output thrown away; status.py always exits 0, and this keeps it that way if it ever does not.
[status]
command:/usr/local/opnsense/scripts/watchdog/status.py
parameters:
errors:no
type:script_output
message:reading the hardware watchdog

[restart]
command:/bin/sh /usr/local/opnsense/scripts/watchdog/watchdog.sh restart
parameters:
type:script_output
message:arming the hardware watchdog from its settings

[stop]
command:/bin/sh /usr/local/opnsense/scripts/watchdog/watchdog.sh stop
parameters:
type:script_output
message:disarming the hardware watchdog
